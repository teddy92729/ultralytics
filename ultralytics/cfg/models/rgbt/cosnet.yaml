# Ultralytics YOLOv8-obb Oriented Bounding Boxes (OBB) model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 5 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-obb.yaml' will call yolov8-obb.yaml with scale 'n'
  # [depth, width, max_channels]
  # n: [0.33, 0.25, 1024] # YOLOv8n-obb summary: 144 layers, 3228867 parameters, 3228851 gradients, 9.1 GFLOPs
  s: [0.33, 0.50, 1024] # YOLOv8s-obb summary: 144 layers, 11452739 parameters, 11452723 gradients, 29.8 GFLOPs
  # m: [0.67, 0.75, 768] # YOLOv8m-obb summary: 184 layers, 26463235 parameters, 26463219 gradients, 81.5 GFLOPs
  # l: [1.00, 1.00, 512] # YOLOv8l-obb summary: 224 layers, 44540355 parameters, 44540339 gradients, 169.4 GFLOPs
  # x: [1.00, 1.25, 512] # YOLOv8x-obb summary: 224 layers, 69555651 parameters, 69555635 gradients, 264.3 GFLOPs
# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Slice, []] # 0

  # RGB branch
  - [0, 1, Slice, [0, 3]] # 1
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 3, C2f, [128, True]] # 4
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 6, C2f, [256, True]] # 6
  # thermal branch
  - [0, 1, Slice, [3, 4]] # 7
  - [-1, 1, Conv, [64, 3, 2]] # 8-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 9-P2/4
  - [-1, 3, C2f, [128, True]] # 10
  - [-1, 1, Conv, [256, 3, 2]] # 11-P3/8
  - [-1, 6, C2f, [256, True]] # 12

  # Fusion
  - [[6, 12], 1, DecoupledAttn, [256, 5]] # 13-P3
  - [-1, 1, Select, [0]] # 14
  - [-2, 1, Select, [1]] # 15

  # RGB branch
  - [14, 1, Conv, [512, 3, 2]] # 16-P4/16
  - [-1, 6, C2f, [512, True]] # 17
  # thermal branch
  - [15, 1, Conv, [512, 3, 2]] # 18-P4/16
  - [-1, 6, C2f, [512, True]] # 19

  # Fusion
  - [[17, 19], 1, DecoupledAttn, [512]] # 20-P4
  - [-1, 1, Select, [0]] # 21
  - [-2, 1, Select, [1]] # 22

  # RGB branch
  - [21, 1, Conv, [1024, 3, 2]] # 23-P5/32
  - [-1, 3, C2f, [1024, True]] # 24
  # Thermal branch
  - [22, 1, Conv, [1024, 3, 2]] # 25-P5/32
  - [-1, 3, C2f, [1024, True]] # 26

  # Fusion
  - [[24, 26], 1, DecoupledAttn, [1024]] # 27-P5
  - [-1, 1, Select, [0]] # 28
  - [-2, 1, Select, [1]] # 29

  - [[14, 15], 1, Add, []] # 30-P3
  - [[21, 22], 1, Add, []] # 31-P4
  - [[28, 29], 1, Add, []] # 32-P5
  - [-1, 1, SPPF, [1024, 5]] # 33

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 34
  - [[-1, 31], 1, Concat, [1]] # 35 cat backbone P4 
  - [-1, 3, C2f, [512]] # 36

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 37
  - [[-1, 30], 1, Concat, [1]] # 38 cat backbone P3
  - [-1, 3, C2f, [256]] # 39 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 40
  - [[-1, 36], 1, Concat, [1]] # 41 cat head P4
  - [-1, 3, C2f, [512]] # 42 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 43
  - [[-1, 33], 1, Concat, [1]] # 44 cat head P5
  - [-1, 3, C2f, [1024]] # 45 (P5/32-large)

  - [[39, 42, 45], 1, OBB, [nc, 1]] # OBB(P3, P4, P5)
