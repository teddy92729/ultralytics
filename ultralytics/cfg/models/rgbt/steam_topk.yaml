# Ultralytics YOLOv8-obb Oriented Bounding Boxes (OBB) model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 5 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-obb.yaml' will call yolov8-obb.yaml with scale 'n'
  # [depth, width, max_channels]
  # n: [0.33, 0.25, 1024] # YOLOv8n-obb summary: 144 layers, 3228867 parameters, 3228851 gradients, 9.1 GFLOPs
  s: [0.33, 0.50, 1024] # YOLOv8s-obb summary: 144 layers, 11452739 parameters, 11452723 gradients, 29.8 GFLOPs
  # m: [0.67, 0.75, 768] # YOLOv8m-obb summary: 184 layers, 26463235 parameters, 26463219 gradients, 81.5 GFLOPs
  # l: [1.00, 1.00, 512] # YOLOv8l-obb summary: 224 layers, 44540355 parameters, 44540339 gradients, 169.4 GFLOPs
  # x: [1.00, 1.25, 512] # YOLOv8x-obb summary: 224 layers, 69555651 parameters, 69555635 gradients, 264.3 GFLOPs
# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Slice, []] # 0

  # RGB branch
  - [0, 1, Slice, [0, 3]] # 1
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 3, C2f, [128, True]] # 4

  # thermal branch
  - [0, 1, Slice, [3, 4]] # 5
  - [-1, 1, Conv, [64, 3, 2]] # 6
  - [-1, 1, Conv, [128, 3, 2]] # 7
  - [-1, 3, C2f, [128, True]] # 8
  
  # PreFusion
  - [[4, 8], 1, SteamModule, [128]] # 9
  - [-1, 1, Select, [0]] # 10
  - [-2, 1, Select, [1]] # 11
  - [[4, 10], 1, Add, []] # 12
  - [[8, 11], 1, Add, []] # 13

  # RGB branch
  - [12, 1, Conv, [256, 3, 2]] # 14
  - [-1, 6, C2f, [256, True]] # 15
  # thermal branch
  - [13, 1, Conv, [256, 3, 2]] # 16
  - [-1, 6, C2f, [256, True]] # 17

  # PreFusion

  - [15, 1, TopkSpatialAttn, [256]] # 18
  - [17, 1, TopkSpatialAttn, [256]] # 19
  - [[15, 17, -2, -1], 1, FusionTopk, [256, 5]] # 20-P3
  - [-1, 1, Select, [0]] # 21
  - [-2, 1, Select, [1]] # 22

  - [[21, 22], 1, SteamModule, [256]] # 23
  - [-1, 1, Select, [0]] # 24
  - [-2, 1, Select, [1]] # 25
  - [[21, 24], 1, Add, []] # 26
  - [[22, 25], 1, Add, []] # 27

  # RGB branch
  - [26, 1, Conv, [512, 3, 2]] # 28
  - [-1, 6, C2f, [512, True]] # 29
  # thermal branch
  - [27, 1, Conv, [512, 3, 2]] # 30
  - [-1, 6, C2f, [512, True]] # 31

  # PreFusion
  - [[29, 31], 1, SteamModule, [512]] # 32
  - [-1, 1, Select, [0]] # 33
  - [-2, 1, Select, [1]] # 34
  - [[29, 33], 1, Add, []] # 35
  - [[31, 34], 1, Add, []] # 36

  # RGB branch
  - [35, 1, Conv, [1024, 3, 2]] # 37
  - [-1, 3, C2f, [1024, True]] # 38

  # Thermal branch
  - [36, 1, Conv, [1024, 3, 2]] # 39
  - [-1, 3, C2f, [1024, True]] # 40

  # Fusion
  - [[15, 17], 1, Add, []] # 41
  - [[29, 31], 1, Add, []] # 42
  - [[38, 40], 1, Add, []] # 43
  - [-1, 1, SPPF, [1024, 5]] # 44

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 45
  - [[-1, 42], 1, Concat, [1]] # 46 cat backbone P4 
  - [-1, 3, C2f, [512]] # 47

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 48
  - [[-1, 41], 1, Concat, [1]] # 49 cat backbone P3
  - [-1, 3, C2f, [256]] # 50 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 51
  - [[-1, 47], 1, Concat, [1]] # 52 cat head P4
  - [-1, 3, C2f, [512]] # 53 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 54
  - [[-1, 44], 1, Concat, [1]] # 55 cat head P5
  - [-1, 3, C2f, [1024]] # 56 (P5/32-large)

  - [[50, 53, 56], 1, OBB, [nc, 1]] # OBB(P3, P4, P5)
