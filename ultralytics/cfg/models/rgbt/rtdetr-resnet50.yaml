# Ultralytics RT-DETR-ResNet50 hybrid object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/rtdetr
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-cls.yaml' will call yolov8-cls.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Slice, []] # 0

  # RGB branch
  - [0, 1, Slice, [0, 3]] # 1
  - [-1, 1, ResNetLayer, [3, 64, 1, True, 1]] # 2
  - [-1, 1, ResNetLayer, [64, 64, 1, False, 3]] # 3
  - [-1, 1, ResNetLayer, [256, 128, 2, False, 4]] # 4-P3
  - [-1, 1, ResNetLayer, [512, 256, 2, False, 6]] # 5-P4
  - [-1, 1, ResNetLayer, [1024, 512, 2, False, 3]] # 6-P5

  # Thermal branch
  - [0, 1, Slice, [3, 4]] # 7
  - [-1, 1, ResNetLayer, [1, 64, 1, True, 1]] # 8
  - [-1, 1, ResNetLayer, [64, 64, 1, False, 3]] # 9
  - [-1, 1, ResNetLayer, [256, 128, 2, False, 4]] # 10-P3
  - [-1, 1, ResNetLayer, [512, 256, 2, False, 6]] # 11-P4
  - [-1, 1, ResNetLayer, [1024, 512, 2, False, 3]] # 12-P5

  # Fusion
  - [[4, 10], 1, Add, []] # 13-P3
  - [[5, 11], 1, Add, []] # 14-P4
  - [[6, 12], 1, Add, []] # 15-P5

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 16
  - [-1, 1, AIFI, [1024, 8]] # 17
  - [-1, 1, Conv, [256, 1, 1]] # 18

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19
  - [14, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 20
  - [[-2, -1], 1, Concat, [1]] # 21
  - [-1, 3, RepC3, [256]] # 22
  - [-1, 1, Conv, [256, 1, 1]] # 23

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 24
  - [13, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 25
  - [[-2, -1], 1, Concat, [1]] # 26 cat backbone P4 (P3 here logically)
  - [-1, 3, RepC3, [256]] # X3 (27), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]] # 28, downsample_convs.0
  - [[-1, 23], 1, Concat, [1]] # 29 cat Y4
  - [-1, 3, RepC3, [256]] # F4 (30), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]] # 31, downsample_convs.1
  - [[-1, 18], 1, Concat, [1]] # 32 cat Y5
  - [-1, 3, RepC3, [256]] # F5 (33), pan_blocks.1

  - [[27, 30, 33], 1, RTDETRDecoder, [nc]] # Detect(P3, P4, P5)
