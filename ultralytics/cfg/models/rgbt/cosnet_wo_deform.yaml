# Ultralytics YOLOv8-obb Oriented Bounding Boxes (OBB) model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 5 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-obb.yaml' will call yolov8-obb.yaml with scale 'n'
  # [depth, width, max_channels]
  # n: [0.33, 0.25, 1024] # YOLOv8n-obb summary: 144 layers, 3228867 parameters, 3228851 gradients, 9.1 GFLOPs
  s: [0.33, 0.50, 1024] # YOLOv8s-obb summary: 144 layers, 11452739 parameters, 11452723 gradients, 29.8 GFLOPs
  # m: [0.67, 0.75, 768] # YOLOv8m-obb summary: 184 layers, 26463235 parameters, 26463219 gradients, 81.5 GFLOPs
  # l: [1.00, 1.00, 512] # YOLOv8l-obb summary: 224 layers, 44540355 parameters, 44540339 gradients, 169.4 GFLOPs
  # x: [1.00, 1.25, 512] # YOLOv8x-obb summary: 224 layers, 69555651 parameters, 69555635 gradients, 264.3 GFLOPs
# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Slice, []] # 0

  # RGB branch
  - [0, 1, Slice, [0, 3]] # 1
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 3, C2f, [128, True]] # 4
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 6, C2f, [256, True]] # 6
  # thermal branch
  - [0, 1, Slice, [3, 4]] # 7
  - [-1, 1, Conv, [64, 3, 2]] # 8-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 9-P2/4
  - [-1, 3, C2f, [128, True]] # 10
  - [-1, 1, Conv, [256, 3, 2]] # 11-P3/8
  - [-1, 6, C2f, [256, True]] # 12

  # Fusion
  - [6, 1, TopkSpatialAttn, [256]] # 13
  - [12, 1, TopkSpatialAttn, [256]] # 14
  - [[6, 12, -2, -1], 1, FusionTopk, [256]] # 15-P3
  - [-1, 1, Select, [0]] # 16
  - [-2, 1, Select, [1]] # 17

  # RGB branch
  - [16, 1, Conv, [512, 3, 2]] # 18-P4/16
  - [-1, 6, C2f, [512, True]] # 19
  # thermal branch
  - [17, 1, Conv, [512, 3, 2]] # 20-P4/16
  - [-1, 6, C2f, [512, True]] # 21

  # Fusion
  - [19, 1, TopkSpatialAttn, [512]] # 22-P4
  - [21, 1, TopkSpatialAttn, [512]] # 23-P4
  - [[19, 21, -2, -1], 1, FusionTopk, [512]] # 24-P4
  - [-1, 1, Select, [0]] # 25
  - [-2, 1, Select, [1]] # 26

  # RGB branch
  - [25, 1, Conv, [1024, 3, 2]] # 27-P5/32
  - [-1, 3, C2f, [1024, True]] # 28
  # Thermal branch
  - [26, 1, Conv, [1024, 3, 2]] # 29-P5/32
  - [-1, 3, C2f, [1024, True]] # 30

  # Fusion
  - [28, 1, TopkSpatialAttn, [1024]] # 31-P5
  - [30, 1, TopkSpatialAttn, [1024]] # 32-P5
  - [[28, 30, -2, -1], 1, FusionTopk, [1024]] # 33-P5
  - [-1, 1, Select, [0]] # 34
  - [-2, 1, Select, [1]] # 35

  - [[16, 17], 1, Add, []] # 36-P3
  - [[25, 26], 1, Add, []] # 37-P4
  - [[34, 35], 1, Add, []] # 38
  - [-1, 1, SPPF, [1024, 5]] # 39-P5

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 40
  - [[-1, 37], 1, Concat, [1]] # 41 cat backbone P4 
  - [-1, 3, C2f, [512]] # 42

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 43
  - [[-1, 36], 1, Concat, [1]] # 44 cat backbone P3
  - [-1, 3, C2f, [256]] # 45 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 46
  - [[-1, 42], 1, Concat, [1]] # 47 cat head P4
  - [-1, 3, C2f, [512]] # 48 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 49
  - [[-1, 39], 1, Concat, [1]] # 50 cat head P5
  - [-1, 3, C2f, [1024]] # 51 (P5/32-large)

  - [[45, 48, 51], 1, OBB, [nc, 1]] # OBB(P3, P4, P5)
