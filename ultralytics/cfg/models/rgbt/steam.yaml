# Ultralytics YOLOv8-obb Oriented Bounding Boxes (OBB) model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 5 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-obb.yaml' will call yolov8-obb.yaml with scale 'n'
  # [depth, width, max_channels]
  # n: [0.33, 0.25, 1024] # YOLOv8n-obb summary: 144 layers, 3228867 parameters, 3228851 gradients, 9.1 GFLOPs
  s: [0.33, 0.50, 1024] # YOLOv8s-obb summary: 144 layers, 11452739 parameters, 11452723 gradients, 29.8 GFLOPs
  # m: [0.67, 0.75, 768] # YOLOv8m-obb summary: 184 layers, 26463235 parameters, 26463219 gradients, 81.5 GFLOPs
  # l: [1.00, 1.00, 512] # YOLOv8l-obb summary: 224 layers, 44540355 parameters, 44540339 gradients, 169.4 GFLOPs
  # x: [1.00, 1.25, 512] # YOLOv8x-obb summary: 224 layers, 69555651 parameters, 69555635 gradients, 264.3 GFLOPs
# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Slice, []] # 0

  # RGB branch
  - [0, 1, Slice, [0, 3]] # 1
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 3, C2f, [128, True]] # 4

  # thermal branch
  - [0, 1, Slice, [3, 4]] # 5
  - [-1, 1, Conv, [64, 3, 2]] # 6
  - [-1, 1, Conv, [128, 3, 2]] # 7
  - [-1, 3, C2f, [128, True]] # 8
  
  # PreFusion
  - [[4, 8], 1, SteamModule, [128]] # 9
  - [-1, 1, Select, [0]] # 10
  - [-2, 1, Select, [1]] # 11
  - [[4, 10], 1, Add, []] # 12
  - [[8, 11], 1, Add, []] # 13

  # RGB branch
  - [12, 1, Conv, [256, 3, 2]] # 14
  - [-1, 6, C2f, [256, True]] # 15
  # thermal branch
  - [13, 1, Conv, [256, 3, 2]] # 16
  - [-1, 6, C2f, [256, True]] # 17
  # PreFusion
  - [[15, 17], 1, SteamModule, [256]] # 18
  - [-1, 1, Select, [0]] # 19
  - [-2, 1, Select, [1]] # 20
  - [[15, 19], 1, Add, []] # 21
  - [[17, 20], 1, Add, []] # 22

  # RGB branch
  - [21, 1, Conv, [512, 3, 2]] # 23
  - [-1, 6, C2f, [512, True]] # 24
  # thermal branch
  - [22, 1, Conv, [512, 3, 2]] # 25
  - [-1, 6, C2f, [512, True]] # 26

  # PreFusion
  - [[24, 26], 1, SteamModule, [512]] # 27
  - [-1, 1, Select, [0]] # 28
  - [-2, 1, Select, [1]] # 29
  - [[24, 28], 1, Add, []] # 30
  - [[26, 29], 1, Add, []] # 31

  # RGB branch
  - [30, 1, Conv, [1024, 3, 2]] # 32
  - [-1, 3, C2f, [1024, True]] # 33
  - [-1, 1, SPPF, [1024, 5]] # 34
  # Thermal branch
  - [31, 1, Conv, [1024, 3, 2]] # 35
  - [-1, 3, C2f, [1024, True]] # 36
  - [-1, 1, SPPF, [1024, 5]] # 37

  # Fusion
  - [[15, 17], 1, Add, []] # 38
  - [[24, 26], 1, Add, []] # 39
  - [[34, 37], 1, Add, []] # 40

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 41
  - [[-1, 39], 1, Concat, [1]] # 42 cat backbone P4 
  - [-1, 3, C2f, [512]] # 43

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 44
  - [[-1, 38], 1, Concat, [1]] # 45 cat backbone P3
  - [-1, 3, C2f, [256]] # 46 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 47
  - [[-1, 43], 1, Concat, [1]] # 48 cat head P4
  - [-1, 3, C2f, [512]] # 49 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 50
  - [[-1, 40], 1, Concat, [1]] # 51 cat head P5
  - [-1, 3, C2f, [1024]] # 52 (P5/32-large)

  - [[46, 49, 52], 1, OBB, [nc, 1]] # OBB(P3, P4, P5)
